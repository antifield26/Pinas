[package]
name = "pi_nas"
version = "1.11.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "limit", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "8.6.0"
sqlx = { version = "0.9", features = [ "runtime-tokio", "sqlite" ] }
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5.3"
password-hash = { version = "0.5", features = ["getrandom"] }
rand_core = "0.10.1"
getrandom = "0.4"
uuid = { version = "1", features = ["v4"] }
infer = "0.19.0"
chrono = "0.4"
mime_guess = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
config = { version = "0.15.25", default-features = false, features = ["convert-case"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
http-body = "1"
base64 = "0.22"
askama = { version = "0.16", features = ["serde_json"] }
# 内核级路径沙箱（openat2 RESOLVE_BENEATH + *at 系统调用族）——P0-4 符号链接 TOCTOU 根治
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.8"
filetime = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
