{# Link create/edit form — inline #}
<div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl mx-auto" onclick="event.stopPropagation()"
     id="link-form-card">
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
    {% if is_edit %}编辑链接{% else %}添加链接{% endif %}
  </h3>
    <button onclick="App.closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none">&times;</button>
  </div>
  <div class="p-5">
  <form {% if is_edit %}hx-put="/links/{{ id }}"{% else %}hx-post="/links"{% endif %}
        hx-target="#links-container" hx-swap="innerHTML"
        hx-on:after-request="App.closeModal()"
        class="space-y-3">
    <div>
      <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">标题 *</label>
      <input type="text" name="title" value="{{ title }}" required placeholder="链接标题..."
             class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">URL *</label>
      <input type="url" name="url" value="{{ url }}" required placeholder="https://..."
             class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">图标（Emoji）</label>
      <input type="text" name="icon" value="{{ icon }}" placeholder="Emoji" maxlength="4"
             class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition">
        {% if is_edit %}保存{% else %}添加{% endif %}
      </button>
      <button type="button" onclick="App.closeModal()"
              class="px-4 py-2 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 rounded-lg text-sm font-medium transition">取消</button>
    </div>
  </form>
</div>
