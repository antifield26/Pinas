{# 弹出式修改密码（导航「账号设置」加载；强制改密仍走独立页 /change-password） #}
<div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl mx-auto" onclick="event.stopPropagation()">
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">修改密码</h3>
    <button onclick="App.closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none" aria-label="关闭">&times;</button>
  </div>
  <div class="p-5">
    <form id="pwd-modal-form" class="space-y-3" onsubmit="return handlePwdModal(event)">
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">当前密码</label>
        <input type="password" id="pwd-current" required autocomplete="current-password"
               class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">新密码（至少 6 位，含字母和数字）</label>
        <input type="password" id="pwd-new" required autocomplete="new-password"
               class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">确认新密码</label>
        <input type="password" id="pwd-confirm" required autocomplete="new-password"
               class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <p id="pwd-modal-error" class="text-sm text-red-500 hidden"></p>
      <div class="flex gap-2 pt-2">
        <button type="submit" id="pwd-modal-submit"
                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition">
          更新密码
        </button>
        <button type="button" onclick="App.closeModal()"
                class="px-4 py-2 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 rounded-lg text-sm font-medium transition">
          取消
        </button>
      </div>
    </form>
  </div>
</div>
<script>
  (function() {
    var form = document.getElementById('pwd-modal-form');
    if (!form) return;
    window.handlePwdModal = function(e) {
      e.preventDefault();
      var current = document.getElementById('pwd-current').value;
      var newPwd = document.getElementById('pwd-new').value;
      var confirm = document.getElementById('pwd-confirm').value;
      var errEl = document.getElementById('pwd-modal-error');
      var btn = document.getElementById('pwd-modal-submit');

      if (newPwd !== confirm) {
        errEl.textContent = '两次输入的新密码不一致';
        errEl.classList.remove('hidden');
        return false;
      }
      if (newPwd.length < 6 || newPwd.length > 128) {
        errEl.textContent = '新密码长度必须为 6-128 个字符';
        errEl.classList.remove('hidden');
        return false;
      }

      btn.textContent = '处理中...';
      btn.disabled = true;
      errEl.classList.add('hidden');

      fetch('/api/user/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ current_password: current, new_password: newPwd })
      }).then(function(res) {
        if (res.ok) {
          App.closeModal();
          App.showToast('密码修改成功', 'success');
        } else {
          return res.text().then(function(text) {
            errEl.textContent = text || '密码修改失败';
            errEl.classList.remove('hidden');
          });
        }
      }).catch(function() {
        errEl.textContent = '网络错误，请检查连接';
        errEl.classList.remove('hidden');
      }).finally(function() {
        btn.textContent = '更新密码';
        btn.disabled = false;
      });
      return false;
    };
  })();
</script>
