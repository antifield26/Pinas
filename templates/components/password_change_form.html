{# 弹出式修改密码（导航「账号设置」加载；强制改密仍走独立页 /change-password） #}
<div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl mx-auto" data-modal-root>
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">修改密码</h3>
    <button data-close-modal class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none" aria-label="关闭">&times;</button>
  </div>
  <div class="p-5">
    <form id="pwd-modal-form" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">当前密码</label>
        <input type="password" id="pwd-current" required autocomplete="current-password"
               class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">新密码（至少 6 位，含字母和数字）</label>
        <input type="password" id="pwd-new" required autocomplete="new-password"
               class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">确认新密码</label>
        <input type="password" id="pwd-confirm" required autocomplete="new-password"
               class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <p id="pwd-modal-error" class="text-sm text-red-500 hidden"></p>
      <div class="flex gap-2 pt-2">
        <button type="submit" id="pwd-modal-submit"
                class="btn-primary flex-1">
          更新密码
        </button>
        <button type="button" data-close-modal
                class="btn-secondary">
          取消
        </button>
      </div>
    </form>
  </div>
</div>
