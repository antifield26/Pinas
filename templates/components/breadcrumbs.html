{# Path breadcrumb navigation #}
{% for part in parts %}
  {% if loop.index0 > 0 %}<span class="text-gray-300 dark:text-gray-600">/</span>{% endif %}
  <a href="#" data-breadcrumb-path="{{ part.path }}" hx-get="/drive/list"
     hx-vals='{"path":{{ part.path | json }}}' hx-target="#drive-file-list"
     class="hover:text-indigo-600 dark:hover:text-indigo-400 transition text-sm {% if loop.last %}font-semibold text-gray-800 dark:text-gray-200{% else %}text-gray-500 dark:text-gray-400{% endif %}">
    {{ part.name }}
  </a>
{% endfor %}
