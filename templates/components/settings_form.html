<div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md shadow-2xl mx-auto" onclick="event.stopPropagation()">
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-700">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">AI 设置</h3>
    <button onclick="App.closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none" aria-label="关闭">&times;</button>
  </div>
  <div class="p-5">
    <form id="settings-form" onsubmit="return App.saveSettings(event)" class="space-y-4">
      <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg p-3 text-xs text-amber-700 dark:text-amber-300">
        此处可配置个人 DeepSeek API。不配置则使用服务器全局设置。
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">API Key</label>
        <input type="password" id="settings-apikey" class="input-field" placeholder="{{ api_key_placeholder }}">
        <p class="text-xs text-gray-400 dark:text-gray-400 mt-1">{{ api_key_hint }}</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">API 基础地址</label>
        <input type="text" id="settings-apibase" class="input-field" placeholder="https://api.deepseek.com" value="{{ api_base }}">
        <p class="text-xs text-gray-400 dark:text-gray-400 mt-1">支持 OpenAI 兼容 API</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">默认模型</label>
        <input type="text" id="settings-model" class="input-field" placeholder="deepseek-v4-flash" value="{{ model }}">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">Temperature ({{ temperature }})</label>
          <input type="range" id="settings-temperature" min="0" max="2" step="0.1" value="{{ temperature }}"
                 class="w-full accent-indigo-600" oninput="this.previousElementSibling.textContent='Temperature ('+this.value+')'">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-gray-300 mb-1">Max Tokens</label>
          <select id="settings-max-tokens" class="input-field">
            <option value="1024" {% if max_tokens == 1024 %}selected{% endif %}>1024</option>
            <option value="2048" {% if max_tokens == 2048 %}selected{% endif %}>2048</option>
            <option value="4096" {% if max_tokens == 4096 %}selected{% endif %}>4096</option>
            <option value="8192" {% if max_tokens == 8192 %}selected{% endif %}>8192</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition">保存设置</button>
        <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 rounded-lg text-sm font-medium transition" aria-label="取消">取消</button>
      </div>
    </form>
  </div>
</div>
<script>
App.saveSettings = async function(e) {
  e.preventDefault();
  const body = {
    deepseek_api_key: document.getElementById('settings-apikey').value.trim() || null,
    deepseek_api_base: document.getElementById('settings-apibase').value.trim() || null,
    deepseek_model: document.getElementById('settings-model').value.trim() || null,
    temperature: parseFloat(document.getElementById('settings-temperature').value),
    max_tokens: parseInt(document.getElementById('settings-max-tokens').value)
  };
  try {
    const res = await fetch('/api/agent/settings', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin', body: JSON.stringify(body)
    });
    if (res.ok) { App.closeModal(); App.showToast('设置已保存', 'success'); }
    else { App.showToast('保存失败', 'error'); }
  } catch(e) { App.showToast('网络错误', 'error'); }
  return false;
};
</script>
