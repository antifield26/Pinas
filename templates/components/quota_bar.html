{# Storage quota bar #}
<div class="flex items-center gap-3">
  
  <div class="flex-1">
    <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mb-1">
      <span>存储配额</span>
      <span>{{ used_mb }} / {{ total_mb }} MB</span>
    </div>
    <div class="w-full bg-gray-200 dark:bg-gray-800 rounded-full h-2 overflow-hidden">
      <div class="h-full transition-all duration-300 rounded-full {% if percent > 90 %}bg-red-500{% else if percent > 70 %}bg-amber-500{% else %}bg-indigo-600{% endif %}" style="width: {{ percent }}%"></div>
    </div>
  </div>
</div>
