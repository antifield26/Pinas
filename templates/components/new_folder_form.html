<div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl mx-auto" data-modal-root>
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">新建文件夹</h3>
    <button data-close-modal class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none">&times;</button>
  </div>
  <div class="p-5">
  <form hx-post="/drive/create-folder" hx-target="#drive-file-list" hx-swap="innerHTML"
        hx-on:after-request="App.closeModal()" class="flex gap-2">
    <input type="hidden" name="current_path" id="new-folder-path" value="/">
    <input type="text" name="name" placeholder="文件夹名称..." required
           class="flex-1 px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <button type="submit" class="btn-primary btn-sm shrink-0">创建</button>
  </form>
</div>
