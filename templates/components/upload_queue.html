{# 上传队列面板（UploadQueue JS 驱动，include 进 drive.html） #}
<div id="upload-panel" class="hidden fixed bottom-4 right-4 z-40 w-80 card p-3 shadow-xl">
  <div class="flex items-center gap-2 mb-2">
    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300 flex-1">上传队列 <span id="upload-panel-count" class="text-gray-400 font-normal">0/0</span></span>
    <span id="upload-panel-pct" class="text-xs font-bold text-indigo-600 dark:text-indigo-400">0%</span>
    <button onclick="UploadQueue.cancel()" class="text-xs text-red-500 hover:text-red-700 font-medium" aria-label="取消全部上传">取消</button>
  </div>
  <div class="h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden mb-2">
    <div id="upload-panel-bar" class="h-full bg-indigo-600 transition-all duration-150 rounded-full" style="width:0%"></div>
  </div>
  <div id="upload-queue-list" class="space-y-1 max-h-40 overflow-y-auto"></div>
</div>
