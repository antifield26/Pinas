{# Admin user list fragment #}
{% if users.is_empty() %}
<div class="p-8 text-center text-gray-400">暂无用户数据</div>
{% else %}
<table class="w-full text-left border-collapse">
  <thead>
    <tr class="bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
      <th class="p-4">用户名</th>
      <th class="p-4 w-24">角色</th>
      <th class="p-4 w-32">已用/配额</th>
      <th class="p-4 w-24 text-right">操作</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-gray-100 dark:divide-gray-800 text-sm">
    {% for u in users %}
    <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50">
      <td class="p-4 font-medium text-gray-800 dark:text-gray-200">{{ u.username }}</td>
      <td class="p-4"><span class="text-xs px-2 py-0.5 rounded-full font-medium {% if u.role == "admin" %}bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400{% else %}bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400{% endif %}">{{ u.role }}</span></td>
      <td class="p-4 text-gray-500 dark:text-gray-400">{{ u.used_mb }} / {{ u.quota_mb }} MB</td>
      <td class="p-4 text-right">
        <button hx-post="/api/admin/user/reset_password" hx-vals='{"username":"{{ u.username }}"}'
                hx-confirm="重置 {{ u.username }} 的密码？" class="text-xs font-medium bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-300 px-2.5 py-1 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900/50 transition">重置密码</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
