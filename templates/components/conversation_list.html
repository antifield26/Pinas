{# Conversation sidebar list fragment #}
{% for c in conversations %}
<div data-conv-id="{{ c.id }}"
     class="conv-item flex items-center gap-1 group px-2 py-1.5 rounded-lg {% if c.id == active_id %}bg-indigo-50 dark:bg-indigo-900/20{% else %}hover:bg-gray-50 dark:hover:bg-gray-800/50{% endif %} transition cursor-pointer"
     hx-get="/agent/conversations?active={{ c.id }}" hx-target="#conv-list" hx-swap="innerHTML">
  <span class="flex-1 text-xs truncate {% if c.id == active_id %}text-indigo-700 dark:text-indigo-300 font-medium{% else %}text-gray-600 dark:text-gray-400{% endif %}">{{ c.title }}</span>
  <button class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 text-xs px-1 transition"
          hx-delete="/api/conversations/{{ c.id }}" hx-swap="none"
          hx-on:after-request="htmx.ajax('GET','/agent/conversations',{target:'#conv-list',swap:'innerHTML'})"
          hx-confirm="删除对话？" aria-label="删除对话">✕</button>
</div>
{% endfor %}
{% if conversations.is_empty() %}
<div class="text-xs text-gray-400 text-center py-4">暂无对话</div>
{% endif %}
