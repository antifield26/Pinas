{# Conversation sidebar list fragment — hover 显示 "..." 菜单(重命名/删除) #}
{# 点击会话由 body 委托处理(loadConversation + refreshConvList 统一刷新双列表) #}
{% for c in conversations %}
<div data-conv-id="{{ c.id }}"
     class="conv-item flex items-center gap-1 group relative px-2 py-1.5 rounded-lg {% if c.id == active_id %}bg-indigo-50 dark:bg-indigo-900/20{% else %}hover:bg-gray-50 dark:hover:bg-gray-800/50{% endif %} transition cursor-pointer">
  <span class="conv-title flex-1 text-xs truncate {% if c.id == active_id %}text-indigo-700 dark:text-indigo-300 font-medium{% else %}text-gray-600 dark:text-gray-400{% endif %}">{{ c.title }}</span>
  <button class="conv-menu-btn opacity-0 group-hover:opacity-100 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xs px-1 transition rounded"
          onclick="AppAgent.openMenu(event, {{ c.id }}, this)" aria-label="更多操作" title="更多操作">•••</button>
</div>
{% endfor %}
{% if conversations.is_empty() %}
<div class="text-xs text-gray-400 text-center py-4">暂无对话</div>
{% endif %}
