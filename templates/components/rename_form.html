<div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md shadow-2xl mx-auto" onclick="event.stopPropagation()">
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-700">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">重命名</h3>
    <button onclick="App.closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none">&times;</button>
  </div>
  <div class="p-5">
  <form hx-post="/drive/rename" hx-target="#drive-file-list" hx-swap="innerHTML"
        hx-on:after-request="App.closeModal()" class="space-y-3">
    <input type="hidden" name="current_path" value="{{ current_path }}">
    <input type="hidden" name="old_name" value="{{ old_name }}">
    <div>
      <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">当前名称</label>
      <div class="px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-md text-sm bg-gray-50 dark:bg-gray-700 text-gray-500 dark:text-gray-400">{{ old_name }}</div>
    </div>
    <div>
      <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">新名称</label>
      <input type="text" name="new_name" placeholder="输入新名称..." required autofocus
             class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div class="flex gap-2 pt-1">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition text-sm">确认重命名</button>
      <button type="button" onclick="App.closeModal()" class="bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 text-gray-700 dark:text-gray-200 font-medium py-2 px-4 rounded-lg transition text-sm">取消</button>
    </div>
  </form>
</div>
