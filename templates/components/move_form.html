<div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl mx-auto" data-modal-root>
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">移动文件</h3>
    <button data-close-modal class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none">&times;</button>
  </div>
  <div class="p-5">
  <form hx-post="/drive/move" hx-target="#drive-file-list" hx-swap="innerHTML"
        hx-on:after-request="App.closeModal()" class="space-y-3">
    <input type="hidden" name="current_path" value="{{ current_path }}">
    <input type="hidden" name="name" value="{{ name }}">
    <div>
      <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">移动项目</label>
      <div class="px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-200 font-medium">{{ name }}</div>
    </div>
    <div>
      <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">目标目录</label>
      <select name="target_dir" required
              class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">/ (根目录)</option>
        {% for dir in dirs %}
        <option value="{{ dir }}">{{ dir }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex gap-2 pt-1">
      <button type="submit" class="btn-primary">确认移动</button>
      <button type="button" data-close-modal class="btn-secondary">取消</button>
    </div>
  </form>
</div>
