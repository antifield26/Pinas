<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
  <div class="flex items-center gap-3">
    <span class="w-3 h-3 rounded-full {% if online %}bg-green-500{% else %}bg-gray-400{% endif %}"></span>
    <div>
      <p class="text-sm font-semibold text-gray-700 dark:text-gray-300">Minecraft 服务器</p>
      <p class="text-xs text-gray-400">{% if online %}{{ motd }}{% else %}{{ error }}{% endif %}</p>
    </div>
  </div>
  <div class="md:border-l md:pl-6 border-gray-100 dark:border-gray-700">
    {% if online %}
    <p class="text-xs text-gray-400">版本: {{ version }}</p>
    <p class="text-sm font-bold text-gray-700 dark:text-gray-300">在线: {{ players }}</p>
    {% if !player_names.is_empty() %}
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">{{ player_names }}</p>
    {% endif %}
    {% else %}
    <p class="text-xs text-gray-400">服务器离线或无法连接</p>
    {% endif %}
  </div>
</div>
