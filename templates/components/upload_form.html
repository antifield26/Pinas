<div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-md shadow-2xl mx-auto" data-modal-root>
  <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">上传文件</h3>
    <button data-close-modal class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none" aria-label="关闭">&times;</button>
  </div>
  <div class="p-5">
  <form id="upload-form" class="space-y-3">
    <div>
      <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">目标目录</label>
      <div class="flex gap-1">
        <input type="text" id="upload-target-path" value="{{ current_path }}"
               class="flex-1 px-3 py-1.5 border border-gray-200 dark:border-gray-700 rounded-md text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
               placeholder="/">
        <button type="button" data-set-value-target="upload-target-path" data-set-value="/"
                class="text-xs px-2 py-1 border border-gray-200 dark:border-gray-700 rounded-md text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 shrink-0" title="重置为根目录">/</button>
      </div>
      <p class="text-[10px] text-gray-400 mt-0.5">例如 /、/docs、/videos/backup</p>
    </div>
    <input type="file" id="upload-file-input" multiple
           class="w-full text-sm text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 dark:file:bg-indigo-900/40 file:text-indigo-700 dark:file:text-indigo-300 hover:file:bg-indigo-100 cursor-pointer border border-gray-200 dark:border-gray-700 rounded-lg p-1">
    <div class="flex gap-2">
      <button type="submit" id="upload-btn" class="btn-primary shrink-0">上传</button>
      <button type="button" data-close-modal class="btn-secondary shrink-0" aria-label="取消上传">取消</button>
    </div>
  </form>
  <div id="upload-progress" class="hidden mt-2">
    <div class="flex justify-between text-xs mb-1"><span id="upload-status">准备上传...</span><span id="upload-pct" class="font-bold text-indigo-600">0%</span></div>
    <div class="w-full bg-gray-200 dark:bg-gray-800 rounded-full h-2 overflow-hidden">
      <div id="upload-bar" class="bg-indigo-600 h-full transition-all duration-150 rounded-full" style="width:0%"></div>
    </div>
  </div>
</div>
