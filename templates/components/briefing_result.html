{# AI briefing result — inserted into chat #}
<div class="flex gap-3">
  <div class="text-sm shrink-0 text-purple-500 font-bold">简报</div>
  <div class="bg-gradient-to-r from-purple-50 to-indigo-50 dark:from-purple-900/20 dark:to-indigo-900/20 border border-purple-200 dark:border-purple-800 rounded-2xl rounded-bl-md px-4 py-2.5 max-w-[85%] text-sm text-gray-800 dark:text-gray-200">
    <div class="prose prose-sm dark:prose-invert max-w-none break-words">{{ content }}</div>
    {% if !model.is_empty() %}
    <div class="text-xs text-gray-400 dark:text-gray-400 mt-1">{{ model }}</div>
    {% endif %}
  </div>
</div>
