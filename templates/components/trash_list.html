{% import "partials/icons.html" as icons %}
{# Trash list fragment #}
{% if items.is_empty() %}
<div class="empty-state">
  <div class="empty-state-icon">{{ icons::icon("trash", "w-7 h-7") }}</div>
  <p class="text-sm text-gray-500 dark:text-gray-400">回收站为空</p>
</div>
{% else %}
<table class="w-full text-left border-collapse">
  <thead>
    <tr class="bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
      <th class="p-4">原路径</th>
      <th class="p-4 w-40">删除时间</th>
      <th class="p-4 w-32 text-right">操作</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-gray-100 dark:divide-gray-800 text-sm">
    {% for item in items %}
    <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50">
      <td class="p-4 font-mono text-xs">{{ item.original_path }}</td>
      <td class="p-4 text-gray-500 dark:text-gray-400">{{ item.deleted_at }}</td>
      <td class="p-4 text-right">
        <button hx-post="/api/trash/restore" hx-vals='{"id":{{ item.id }}}' hx-target="#trash-content"
                class="text-xs font-medium bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-300 px-2.5 py-1 rounded-lg hover:bg-green-100 dark:hover:bg-green-900/50 transition">还原</button>
        <button hx-post="/api/trash/delete" hx-vals='{"id":{{ item.id }}}' hx-target="#trash-content"
                hx-confirm="永久删除？" class="text-xs font-medium bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-300 px-2.5 py-1 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/50 transition">删除</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
