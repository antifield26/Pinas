{% extends "base.html" %}
{% block title %}Antifield Cloud — 回收站{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center gap-2">
    <h2 class="text-xl font-bold text-gray-700 dark:text-gray-300">回收站</h2>
    <div class="flex-1"></div>
    <button hx-post="/trash/clear" hx-target="#trash-content" hx-confirm="确定清空所有回收站内容？"
            class="text-xs font-medium text-red-600 dark:text-red-400 hover:text-red-800 transition bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 px-3 py-1.5 rounded-lg">
      清空回收站
    </button>
  </div>
  <p class="text-xs text-gray-400 dark:text-gray-400">文件在此保留30天，可还原或永久删除</p>

  <div class="card overflow-hidden">
    <div id="trash-content" hx-get="/trash/list" hx-trigger="load" class="overflow-x-auto">
      <div class="p-8 text-center text-gray-400">加载中...</div>
    </div>
  </div>
</div>
{% endblock %}
