<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Antifield Cloud — 修改密码</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='bold' fill='white'>A</text></svg>">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css?v=18">
  {% include "partials/theme_head.html" %}
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
  <button data-toggle-dark class="fixed top-4 right-4 text-lg p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition" aria-label="切换主题" title="切换主题">🌓</button>
  <div class="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-800 text-center">
    <h1 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-2">修改密码</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">定期更换密码可以提升账号安全</p>

    <form id="pwd-form" class="space-y-4">
      <label for="current-password" class="sr-only">当前密码</label>
      <input type="password" id="current-password" placeholder="当前密码" required autocomplete="current-password"
             class="input-field text-center text-lg">
      <label for="new-password" class="sr-only">新密码</label>
      <input type="password" id="new-password" placeholder="新密码（至少6位，含字母和数字）" required autocomplete="new-password"
             class="input-field text-center text-lg tracking-widest">
      <label for="confirm-password" class="sr-only">确认新密码</label>
      <input type="password" id="confirm-password" placeholder="确认新密码" required autocomplete="new-password"
             class="input-field text-center text-lg tracking-widest">

      <button type="submit" id="submit-btn"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 rounded-xl transition shadow-md">
        更新密码
      </button>

      <p id="error-msg" class="text-sm text-red-500 hidden"></p>
    </form>

    <a href="/" class="inline-block mt-6 text-sm text-gray-400 dark:text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition">← 返回</a>
  </div>

  <script src="/assets/app.js?v=1" data-cfasync="false"></script>
</body>
</html>
