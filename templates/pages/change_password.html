<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Antifield Cloud — 修改密码</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='bold' fill='white'>A</text></svg>">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css?v=14">
  {% include "partials/theme_head.html" %}
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
  <button onclick="toggleDark()" class="fixed top-4 right-4 text-lg p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition" aria-label="切换主题" title="切换主题">🌓</button>
  <div class="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-800 text-center">
    <h1 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-2">需要修改密码</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">首次登录或管理员重置密码后，请设置新密码</p>

    <form id="pwd-form" class="space-y-4" onsubmit="return handleChangePwd(event)">
      <input type="password" id="current-password" placeholder="当前密码" required autocomplete="current-password"
             class="input-field text-center text-lg">
      <input type="password" id="new-password" placeholder="新密码（至少6位，含字母和数字）" required autocomplete="new-password"
             class="input-field text-center text-lg tracking-widest">
      <input type="password" id="confirm-password" placeholder="确认新密码" required autocomplete="new-password"
             class="input-field text-center text-lg tracking-widest">

      <button type="submit" id="submit-btn"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 rounded-xl transition shadow-md">
        更新密码
      </button>

      <p id="error-msg" class="text-sm text-red-500 hidden"></p>
    </form>
  </div>

  <script>
    async function handleChangePwd(e) {
      e.preventDefault();
      var current = document.getElementById('current-password').value;
      var newPwd = document.getElementById('new-password').value;
      var confirm = document.getElementById('confirm-password').value;
      var errEl = document.getElementById('error-msg');
      var btn = document.getElementById('submit-btn');

      if (newPwd !== confirm) {
        errEl.textContent = '两次输入的新密码不一致';
        errEl.classList.remove('hidden');
        return false;
      }

      if (newPwd.length < 6 || newPwd.length > 128) {
        errEl.textContent = '新密码长度必须为 6-128 个字符';
        errEl.classList.remove('hidden');
        return false;
      }

      btn.textContent = '处理中...';
      btn.disabled = true;
      errEl.classList.add('hidden');

      try {
        var res = await fetch('/api/user/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ current_password: current, new_password: newPwd })
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          var text = await res.text();
          errEl.textContent = text || '密码修改失败';
          errEl.classList.remove('hidden');
        }
      } catch (e) {
        errEl.textContent = '网络错误，请检查连接';
        errEl.classList.remove('hidden');
      }

      btn.textContent = '更新密码';
      btn.disabled = false;
      return false;
    }
  </script>
</body>
</html>
