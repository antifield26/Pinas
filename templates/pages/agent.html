{% extends "base.html" %}
{% block title %}Antifield Cloud — AI Chat{% endblock %}

{% block head_extra %}{% endblock %}

{% block content %}
<div class="space-y-6 h-[calc(100vh-120px)] min-h-[500px]">
  <!-- 顶栏 -->
  <div class="flex items-center gap-2 flex-wrap shrink-0">
    <h2 class="text-xl font-bold text-gray-700 dark:text-gray-300">AI Chat</h2>
    <div class="flex-1"></div>
    <select id="agent-model-select" name="model"
            class="text-xs px-2 py-1.5 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <option value="">默认模型</option>
      <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
      <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
    </select>
    <button hx-get="/agent/settings-form" hx-target="#modal-container"
            class="text-xs font-medium text-gray-500 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg">设置</button>
  </div>

  <!-- 主体：侧边栏 + 对话区 -->
  <div class="flex gap-4 flex-1 min-h-0">
    <!-- 对话侧边栏 -->
    <div class="w-48 shrink-0 hidden sm:flex flex-col card p-3 gap-1 overflow-hidden">
      <div class="flex items-center gap-1 mb-1">
        <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 flex-1">对话</span>
        <button onclick="AppAgent.newConversation()"
                class="text-indigo-600 hover:text-indigo-800 text-lg leading-none" aria-label="新建对话" title="新建对话">+</button>
      </div>
      <div id="conv-list" hx-get="/agent/conversations" hx-trigger="load" class="fade-me flex-1 overflow-y-auto space-y-0.5">
        <div class="text-xs text-gray-400 text-center py-4">加载中...</div>
      </div>
    </div>

    <!-- 对话主区域 -->
    <div class="flex-1 card flex flex-col min-h-0 min-w-0">
      <div id="agent-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="text-center py-10 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 dark:text-gray-300">AI Chat</h3>
          <p class="text-sm text-gray-400 dark:text-gray-400 max-w-md mx-auto">由 DeepSeek 驱动。</p>
          <div class="flex justify-center gap-3 flex-wrap">
            <button hx-post="/agent/briefing" hx-target="#agent-chat-messages" hx-swap="beforeend"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">生成简报</button>
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900/50">
        <form id="agent-chat-form" hx-post="/agent/chat" hx-target="#agent-chat-messages" hx-swap="beforeend"
              hx-on:after-request="AppAgent.onSent(); this.reset(); document.getElementById('agent-input').focus()"
              class="flex gap-2">
          <input type="hidden" name="model" value="" id="agent-model-hidden">
          <input type="hidden" name="conversation_id" value="" id="agent-conversation-id">
          <textarea id="agent-input" name="message" placeholder="输入消息... (Enter 发送)"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"
                    class="flex-1 px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" rows="1" required></textarea>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shrink-0">发送</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // ====== AI 对话持久化交互 ======
  window.AppAgent = {
    currentConvId: null,

    // 渲染一条消息（纯 DOM + textContent，防注入；样式与 chat_message.html 一致）
    appendMessage: function(role, content) {
      var box = document.getElementById('agent-chat-messages');
      if (!box) return;
      var wrapper = document.createElement('div');
      wrapper.className = role === 'user'
        ? 'flex gap-3 justify-end animate-slide-up'
        : 'flex gap-3 animate-slide-up';
      if (role === 'user') {
        var bubble = document.createElement('div');
        bubble.className = 'bg-indigo-600 text-white rounded-2xl rounded-br-md px-4 py-2.5 max-w-[80%] text-sm';
        var p = document.createElement('p');
        p.className = 'whitespace-pre-wrap break-words';
        p.textContent = content;
        bubble.appendChild(p);
        wrapper.appendChild(bubble);
      } else {
        var label = document.createElement('div');
        label.className = 'text-sm shrink-0 text-indigo-500 font-bold';
        label.textContent = 'AI';
        var bubble = document.createElement('div');
        bubble.className = 'bg-gray-100 dark:bg-gray-800 rounded-2xl rounded-bl-md px-4 py-2.5 max-w-[80%] text-sm text-gray-800 dark:text-gray-200';
        var p = document.createElement('p');
        p.className = 'whitespace-pre-wrap break-words';
        p.textContent = content;
        bubble.appendChild(p);
        wrapper.appendChild(label);
        wrapper.appendChild(bubble);
      }
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
    },

    // 新建对话：创建后清空消息区并记 id
    newConversation: function() {
      fetch('/api/conversations', { method: 'POST', credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(conv) {
          AppAgent.currentConvId = conv.id;
          var box = document.getElementById('agent-chat-messages');
          if (box) box.innerHTML = '';
          htmx.ajax('GET', '/agent/conversations', { target: '#conv-list', swap: 'innerHTML', values: { active: AppAgent.currentConvId || '' } });
        })
        .catch(function() { App.showToast('创建对话失败', 'error'); });
    },

    // 加载指定对话的消息历史
    loadConversation: function(id) {
      fetch('/api/conversations/' + id + '/messages', { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(messages) {
          AppAgent.currentConvId = id;
          var box = document.getElementById('agent-chat-messages');
          if (box) box.innerHTML = '';
          messages.forEach(function(m) { AppAgent.appendMessage(m.role, m.content); });
        })
        .catch(function() { App.showToast('加载对话失败', 'error'); });
    },

    // 提交后：更新会话 id（后端可能自动创建）并刷新对话列表标题
    onSent: function() {
      htmx.ajax('GET', '/agent/conversations', { target: '#conv-list', swap: 'innerHTML', values: { active: AppAgent.currentConvId || '' } });
    }
  };

  // 发送前确保存在会话 id（无则先创建）
  document.getElementById('agent-chat-form')?.addEventListener('submit', function(e) {
    var hidden = document.getElementById('agent-conversation-id');
    if (AppAgent.currentConvId) {
      hidden.value = AppAgent.currentConvId;
    } else {
      e.preventDefault();
      fetch('/api/conversations', { method: 'POST', credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(conv) {
          AppAgent.currentConvId = conv.id;
          hidden.value = conv.id;
          e.target.requestSubmit();
        })
        .catch(function() { App.showToast('创建对话失败', 'error'); });
    }
  });

  // 对话条目点击：加载消息历史（hx-get 负责列表高亮）
  document.body.addEventListener('click', function(e) {
    var item = e.target.closest('[data-conv-id]');
    if (!item) return;
    AppAgent.loadConversation(parseInt(item.getAttribute('data-conv-id'), 10));
  });

  document.getElementById('agent-model-select')?.addEventListener('change', function() {
    document.getElementById('agent-model-hidden').value = this.value;
  });
  document.getElementById('agent-input')?.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 150) + 'px';
  });
</script>
{% endblock %}
