<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Antifield Cloud — 登录</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='bold' fill='white'>A</text></svg>">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css?v=19">
  {% include "partials/theme_head.html" %}
{% import "partials/icons.html" as icons %}
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
  <button data-toggle-dark class="icon-btn fixed top-4 right-4" aria-label="切换主题" title="切换主题">{{ icons::icon("moon", "w-5 h-5") }}</button>
  <div class="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-800 text-center">
    <h1 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-8">Antifield Cloud</h1>

    <form id="login-form" class="space-y-4">
      <label for="username" class="sr-only">用户名</label>
      <input type="text" id="username" placeholder="用户名" required autocomplete="username"
             class="input-field text-center text-lg">
      <label for="password" class="sr-only">密码</label>
      <input type="password" id="password" placeholder="密码" required autocomplete="current-password"
             class="input-field text-center tracking-widest text-lg">

      <button type="submit" id="login-btn"
              class="btn-primary w-full py-3">
        验证并进入
      </button>

      <p id="login-error" class="text-sm text-red-500 hidden"></p>
    </form>

    <div class="pt-4 mt-4 border-t border-gray-100 dark:border-gray-800">
      <button data-toggle-register
              class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 font-medium transition"
              id="toggle-btn">没有账号？点击注册</button>
    </div>
  </div>

  <script src="/assets/app.js?v=1" data-cfasync="false"></script>
</body>
</html>
