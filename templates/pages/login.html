<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Antifield Cloud — 登录</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><text x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='bold' fill='white'>A</text></svg>">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css?v=16">
  {% include "partials/theme_head.html" %}
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
  <button onclick="toggleDark()" class="fixed top-4 right-4 text-lg p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition" aria-label="切换主题" title="切换主题">🌓</button>
  <div class="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-800 text-center">
    <h1 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-8">Antifield Cloud</h1>

    <form id="login-form" class="space-y-4" onsubmit="return handleLogin(event)">
      <input type="text" id="username" placeholder="用户名" required autocomplete="username"
             class="input-field text-center text-lg">
      <input type="password" id="password" placeholder="密码" required autocomplete="current-password"
             class="input-field text-center tracking-widest text-lg">

      <button type="submit" id="login-btn"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 rounded-xl transition shadow-md">
        验证并进入
      </button>

      <p id="login-error" class="text-sm text-red-500 hidden"></p>
    </form>

    <div class="pt-4 mt-4 border-t border-gray-100 dark:border-gray-800">
      <button onclick="toggleRegister()"
              class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 font-medium transition"
              id="toggle-btn">没有账号？点击注册</button>
    </div>
  </div>

  <script>
    var isRegister = false;

    function toggleRegister() {
      isRegister = !isRegister;
      document.getElementById('login-btn').textContent = isRegister ? '注册' : '验证并进入';
      document.getElementById('toggle-btn').textContent = isRegister ? '已有账号？点击登录' : '没有账号？点击注册';
      document.getElementById('login-error').classList.add('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var errEl = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');

      if (!username || !password) {
        errEl.textContent = '请填写用户名和密码';
        errEl.classList.remove('hidden');
        return false;
      }

      btn.textContent = '处理中...';
      btn.disabled = true;
      errEl.classList.add('hidden');

      try {
        var endpoint = isRegister ? '/api/register' : '/api/login';
        var res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        if (res.ok) {
          var data = await res.json();
          // token 由服务器通过 httpOnly Cookie 自动设置，客户端不再存储
          if (data.must_change_pwd) {
            window.location.href = '/change-password';
          } else {
            // redirect 仅允许站内绝对路径：拒绝 https://、//evil.com、javascript: 等（开放重定向/XSS）
            var params = new URLSearchParams(window.location.search);
            var target = params.get('redirect') || '/';
            if (target.charAt(0) !== '/' || target.charAt(1) === '/') target = '/';
            window.location.href = target;
          }
        } else {
          var text = await res.text();
          errEl.textContent = text || '认证失败';
          errEl.classList.remove('hidden');
        }
      } catch (e) {
        errEl.textContent = '网络错误，请检查连接';
        errEl.classList.remove('hidden');
      }

      btn.textContent = isRegister ? '注册' : '验证并进入';
      btn.disabled = false;
      return false;
    }
  </script>
</body>
</html>
